
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>HTML Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 6px;
    background: white;
    color: #111;
    font-family: "Times New Roman", serif;
    font-size: 14px;
}

.page {
    position: relative;
    width: 100%;
    height: 200px;
    padding: 10px;
    border: 1px solid #bdbdbd;
    overflow: hidden;
    background: white;
}

form {
    margin: 0;
    padding: 0;
}

/* Semua baris memiliki posisi yang konsisten */
.row {
    display: grid;
    grid-template-columns: 65px auto;
    align-items: start;
    column-gap: 5px;
    margin-bottom: 8px;
}

label {
    padding-top: 4px;
}

input {
    height: 22px;
    padding: 3px 5px;
    border: 1px solid #bdbdbd;
    border-radius: 2px;
    background: white;
    font-family: monospace;
    font-size: 11px;
}

.name {
    width: 200px;
}

.email {
    width: 200px;
}

.postcode {
    width: 130px;
}

/* Address sejajar dengan kolom input lainnya */
.address {
    width: 200px;
    height: 76px;
    overflow-y: scroll;
    overflow-x: hidden;
    border: 1px solid #bdbdbd;
    border-radius: 2px;
    padding: 3px;
    background: white;
    font-family: monospace;
    font-size: 11px;
}

.address div {
    height: 15px;
    line-height: 15px;
    white-space: nowrap;
}

/* Tombol panah halaman */
.page-arrows {
    position: absolute;
    top: 2px;
    right: 2px;
    bottom: 2px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.page-arrows button {
    width: 14px;
    height: 14px;
    padding: 0;
    border: none;
    background: white;
    color: #888;
    font-size: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="page" id="page">
    <form>
        <div class="row">
            <label for="name">Name:</label>
            <input class="name" type="text" id="name"
                   placeholder="you name here">
        </div>

        <div class="row">
            <label for="email">Email:</label>
            <input class="email" type="email" id="email"
                   placeholder="your email here">
        </div>

        <div class="row">
            <label for="address">Address:</label>
            <div class="address" id="address">
                <div>25 Nowhere Street</div>
                <div>Somewhere</div>
                <div>Not Here</div>
                <div>Y2K 5RU</div>
            </div>
        </div>

        <div class="row">
            <label for="postcode">Postcode:</label>
            <input class="postcode" type="text" id="postcode"
                   placeholder="postal code">
        </div>
    </form>

    <div class="page-arrows">
        <button type="button"
            onclick="document.getElementById('page').scrollTop -= 20">▲</button>
        <button type="button"
            onclick="document.getElementById('page').scrollTop += 20">▼</button>
    </div>
</div>

</body>
</html>
